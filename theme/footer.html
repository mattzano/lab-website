<script>
/* Symmune-style page chaining: keep scrolling past the end of a page to move to the next one. */
(function () {
  var next = document.querySelector('a.nm-next:not(.nm-up)');
  if (!next) return;
  var pull = 0, timer = null, THRESHOLD = 900;
  function atBottom() {
    return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
  }
  function setPull(v) {
    pull = Math.max(0, v);
    next.style.setProperty('--nm-pull', Math.min(pull / THRESHOLD, 1));
    if (pull >= THRESHOLD) { window.location.href = next.href; }
  }
  window.addEventListener('wheel', function (e) {
    if (!atBottom() || e.deltaY <= 0) { setPull(0); return; }
    setPull(pull + e.deltaY);
    clearTimeout(timer);
    timer = setTimeout(function () { setPull(0); }, 700);
  }, { passive: true });
})();

/* Home: the spine draws itself station by station as you scroll; stations light as they arrive. */
(function () {
  var stations = document.querySelectorAll('.nm-unit .nm-station');
  if (!stations.length) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    stations.forEach(function (s) { s.classList.add('is-on'); });
    return;
  }
  var queued = false;
  function update() {
    queued = false;
    var line = window.innerHeight * 0.62;
    stations.forEach(function (s) {
      var r = s.getBoundingClientRect();
      var p = Math.max(0, Math.min(1, (line - r.top) / r.height));
      s.style.setProperty('--draw', p.toFixed(4));
      s.classList.toggle('is-on', r.top + 40 < line);
    });
  }
  window.addEventListener('scroll', function () { if (!queued) { queued = true; requestAnimationFrame(update); } }, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
/* Contact: #work opens the "Work with us" tab. */
(function () {
  if (location.hash !== '#work') return;
  var tab = Array.prototype.find.call(document.querySelectorAll('.panel-tabset .nav-link'), function (a) { return /work with us/i.test(a.textContent); });
  if (tab) { tab.click(); tab.scrollIntoView({ block: 'start' }); }
})();
</script>
