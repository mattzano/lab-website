<script>
/* Symmune-style page chaining: keep scrolling past the end of a page to move to the next one. */
(function () {
  var next = document.querySelector('a.nm-next:not(.nm-up)');
  if (!next) return;
  var pull = 0, timer = null, THRESHOLD = 900;
  function atBottom() {
    return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
  }
  function setPull(v) {
    pull = Math.max(0, v);
    next.style.setProperty('--nm-pull', Math.min(pull / THRESHOLD, 1));
    if (pull >= THRESHOLD) { window.location.href = next.href; }
  }
  window.addEventListener('wheel', function (e) {
    if (!atBottom() || e.deltaY <= 0) { setPull(0); return; }
    setPull(pull + e.deltaY);
    clearTimeout(timer);
    timer = setTimeout(function () { setPull(0); }, 700);
  }, { passive: true });
})();
</script>
