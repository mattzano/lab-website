project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - research.qmd
    - lab.qmd
    - people.qmd
    - trials.qmd
    - news/*.qmd
    - patients.qmd
    - pazienti.qmd
    - contact.qmd
    - privacy.qmd
  resources:
    - theme/fonts/
    - images/

website:
  title: "NeuroMuscle Lab"
  site-url: https://neuromusclelab.org
  description: "NeuroMuscle Lab, Università degli Studi di Padova: from motor neuron to muscle fibre."
  favicon: images/favicon.svg
  image: images/social-card.png
  open-graph:
    locale: en_GB
    site-name: "NeuroMuscle Lab"
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image-width: 1200
    image-height: 630
  search: false
  page-navigation: false
  navbar:
    collapse-below: xl
    logo: images/mark.svg
    logo-alt: "NeuroMuscle Lab"
    title: "NeuroMuscle Lab"
    right:
      - href: research.qmd
        text: Research
      - href: lab.qmd
        text: Lab
      - href: people.qmd
        text: Team
      - href: trials.qmd
        text: Trials
      - href: patients.qmd
        text: Patients
      - href: contact.qmd
        text: Get in touch

format:
  html:
    theme:
      - darkly
      - theme/neuromuscle.scss
    include-in-header: theme/head.html
    include-after-body: theme/footer.html
    toc: false
    anchor-sections: false
    citeproc: true
    html-math-method: plain
    link-external-newwindow: true
    link-external-icon: false
    lang: en
