name: Update publications

# Every Monday at 06:00 UTC (and on demand from the Actions tab): fetch new papers from
# PubMed/OpenAlex for the members in data/members.json, re-render the site into docs/,
# and commit the result so GitHub Pages serves the updated Publications page.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch publications and build the feed
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python3 scripts/update_publications.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json _publications docs
          git diff --cached --quiet || git commit -m "Update publications feed"
          git push
